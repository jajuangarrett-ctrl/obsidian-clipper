<!DOCTYPE html>
<html>
	<head>
		<title>FJG Task Clipper Settings</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="style.css">
		<script src="browser-polyfill.min.js"></script>
	</head>
	<body class="settings-page">
		<main class="settings-shell">
			<header class="settings-header">
				<div>
					<p class="eyebrow">Obsidian</p>
					<h1>Task Clipper Settings</h1>
				</div>
			</header>

			<section class="settings-section">
				<h2>Destination</h2>
				<div class="settings-grid">
					<label>
						<span>Vault name (optional)</span>
						<input id="vault-name" type="text" autocomplete="off">
					</label>
					<label>
						<span>Task index page</span>
						<input id="destination-file" type="text" autocomplete="off">
					</label>
					<label>
						<span>Task notes folder</span>
						<input id="task-folder" type="text" autocomplete="off">
					</label>
				</div>
			</section>

			<section class="settings-section">
				<h2>People</h2>
				<p class="settings-help">The popup loads People from FJG Objective Manager 0.23.2 or later. Add optional names here for use when the catalog is unavailable. Existing projects are not converted into people.</p>
				<div class="settings-grid">
					<label>
						<span>Catalog port</span>
						<input id="catalog-port" type="number" min="1024" max="65535" autocomplete="off">
					</label>
					<label>
						<span>Pairing token</span>
						<input id="catalog-token" type="password" autocomplete="off" placeholder="From FJG Task Manager settings">
					</label>
				</div>
				<button id="test-catalog" class="secondary" type="button">Test catalog connection</button>
				<form id="person-form" class="manage-form">
					<input id="person-name" type="text" placeholder="Person name" autocomplete="off">
					<button type="submit">Add person</button>
				</form>
				<div id="people-list" class="manage-list"></div>
			</section>

			<section class="settings-section">
				<h2>Tags</h2>
				<form id="tag-form" class="manage-form">
					<input id="tag-name" type="text" placeholder="Tag name" autocomplete="off">
					<button type="submit">Add tag</button>
				</form>
				<div id="tag-list" class="manage-list"></div>
			</section>

			<section class="settings-section">
				<h2>Statuses</h2>
				<form id="status-form" class="manage-form status-form">
					<input id="status-label" type="text" placeholder="Label" autocomplete="off">
					<input id="status-id" type="text" placeholder="Status tag value" autocomplete="off">
					<button type="submit">Add status</button>
				</form>
				<div id="status-list" class="manage-list"></div>
				<button id="reset-statuses" class="secondary" type="button">Reset default statuses</button>
			</section>

			<section class="settings-section">
				<h2>AI Title</h2>
				<div class="settings-grid">
					<label>
						<span>OpenAI model</span>
						<input id="openai-model" type="text" autocomplete="off">
					</label>
					<label>
						<span>OpenAI API key</span>
						<input id="openai-api-key" type="password" autocomplete="off" placeholder="Stored locally in Chrome">
					</label>
				</div>
			</section>

			<p id="settings-notice" class="notice" role="status"></p>
			<footer class="settings-actions">
				<button id="save-settings" class="primary" type="button">Save settings</button>
			</footer>
		</main>
		<script type="module" src="settings.js"></script>
	</body>
</html>
